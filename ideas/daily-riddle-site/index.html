<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Riddle Site</title>
  <meta name="description" content="One challenging riddle every day — the same riddle for everyone, picked deterministically from today's date. Browse the archive by date too." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <div class="hero">
      <span class="pixel-gem hero__mark" aria-hidden="true"></span>
      <h1>Daily Riddle</h1>
      <p class="tagline">A new riddle every day, the same one for every visitor. Come back tomorrow for another.</p>
    </div>

    <section class="quest-card pixel-frame fade-in" aria-label="Today's riddle">
      <div class="pixel-panel">
        <div class="quest-card__head">
          <span class="quest-card__label">Today&rsquo;s Riddle</span>
          <span class="pixel-chip pixel-chip--gold mono" id="dr-date"></span>
        </div>

        <div class="dialogue-box">
          <span class="pixel-gem dialogue-box__mark" aria-hidden="true"></span>
          <p class="riddle-text" id="dr-riddle-text"></p>
        </div>

        <div class="reveal-row">
          <span class="btn-pixel-wrap">
            <button type="button" class="btn-pixel" id="dr-reveal">Reveal answer</button>
          </span>
        </div>

        <div class="vault">
          <p class="riddle-answer" id="dr-answer" hidden></p>
          <div class="vault__locked" aria-hidden="true">
            <span class="pixel-gem pixel-gem--cyan" style="--u: 2px;"></span>
            Sealed &mdash; press reveal
          </div>
          <div class="vault__burst" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
      </div>
    </section>

    <h2>Archive</h2>
    <section class="pixel-frame" aria-label="Riddle archive">
      <div class="pixel-panel">
        <div class="stack">
          <div class="row">
            <div class="field">
              <label for="dr-archive-date">Pick a past date</label>
              <input type="date" id="dr-archive-date" />
            </div>
          </div>
          <div class="row">
            <span class="btn-pixel-wrap">
              <button type="button" class="btn-pixel btn-pixel--ghost" id="dr-archive-view">View that day&rsquo;s riddle</button>
            </span>
          </div>

          <div class="stack" id="dr-archive-result" hidden>
            <div class="quest-card__head">
              <span class="quest-card__label">Selected Day</span>
              <span class="pixel-chip mono" id="dr-archive-date-label"></span>
            </div>

            <div class="dialogue-box">
              <span class="pixel-gem pixel-gem--cyan dialogue-box__mark" aria-hidden="true"></span>
              <p class="riddle-text" id="dr-archive-text"></p>
            </div>

            <div class="reveal-row">
              <span class="btn-pixel-wrap">
                <button type="button" class="btn-pixel" id="dr-archive-reveal">Reveal answer</button>
              </span>
            </div>

            <div class="vault">
              <p class="riddle-answer" id="dr-archive-answer" hidden></p>
              <div class="vault__locked" aria-hidden="true">
                <span class="pixel-gem pixel-gem--cyan" style="--u: 2px;"></span>
                Sealed &mdash; press reveal
              </div>
              <div class="vault__burst" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
