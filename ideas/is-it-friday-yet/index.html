<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Is It Friday Yet?</title>
  <meta name="description" content="A simple one-page site that tells you, dramatically, whether it is Friday yet." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>

  <header class="board-header">
    <a class="home" href="/">&larr; more tools</a>
    <span class="board-live"><span class="live-dot" aria-hidden="true"></span>LIVE</span>
  </header>

  <main class="board-wrap">
    <p class="board-eyebrow">// weekly status board //</p>
    <h1 class="board-title">IS IT <span class="board-title-accent">FRIDAY</span> YET?</h1>

    <section class="board" id="board" aria-label="Friday status board">
      <div class="board-answer-label">TODAY&rsquo;S VERDICT</div>

      <div class="flap-row" id="answer" aria-hidden="true"></div>
      <span class="sr-only" id="answer-sr">Checking&hellip;</span>

      <p class="board-submessage" id="message">Checking the calendar&hellip;</p>

      <div class="board-rows">
        <div class="board-row">
          <span class="board-row-label">Day</span>
          <span class="board-row-value" id="row-day">&mdash;</span>
        </div>
        <div class="board-row">
          <span class="board-row-label">Date</span>
          <span class="board-row-value" id="row-date">&mdash;</span>
        </div>
        <div class="board-row">
          <span class="board-row-label">Next Friday</span>
          <span class="board-row-value" id="row-countdown">&mdash;</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="board-footer">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
