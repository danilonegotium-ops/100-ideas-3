<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hobby Finder Quiz</title>
  <meta name="description" content="A short quiz that suggests real hobbies based on your budget, social preference, and available time." />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>

  <main class="wrap">
    <div class="hero">
      <p class="eyebrow">A two-minute detour</p>
      <h1>Find your next <span class="highlight">hobby</span></h1>
      <p class="tagline">Answer six quick questions about your budget, vibe, and free time &mdash; get three real hobbies that actually fit.</p>
    </div>

    <section class="quiz-stage" id="quiz-view">
      <ol class="quiz-progress" id="quiz-progress" aria-label="Quiz progress"></ol>

      <form class="quiz-card" id="quiz-form" novalidate>
        <div id="quiz-questions"></div>
        <p class="quiz-error" id="quiz-error" hidden role="alert">Pick an answer to continue.</p>
        <div class="quiz-nav">
          <button type="button" class="btn-back" id="quiz-back">&larr; Back</button>
          <button type="submit" class="btn-next" id="quiz-next">Next &rarr;</button>
        </div>
      </form>
    </section>

    <section class="results-stage" id="results-view" hidden>
      <canvas class="confetti-canvas" id="confetti-canvas" aria-hidden="true"></canvas>
      <p class="eyebrow">Drumroll&hellip;</p>
      <h2>Your top matches</h2>
      <div class="results-list" id="results-list"></div>
      <button type="button" class="btn-back" id="quiz-retake">&larr; Retake the quiz</button>
    </section>
  </main>

  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
