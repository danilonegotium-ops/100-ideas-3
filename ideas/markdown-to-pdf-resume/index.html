<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown to PDF Resume</title>
  <meta name="description" content="Write your resume in Markdown, see a live styled preview, and export a clean PDF with your browser's print dialog." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="grain no-print" aria-hidden="true"></div>

  <header class="masthead no-print">
    <a class="home-link" href="/">&larr; more tools</a>
    <span class="masthead-badge">no signup &middot; no tracking</span>
  </header>

  <main class="studio">
    <div class="studio-intro no-print">
      <p class="kicker">Markdown &rarr; PDF</p>
      <h1>Markdown to PDF Resume</h1>
      <p class="tagline">Write your resume in Markdown on the left. The preview on the right is what gets exported &mdash; press <span class="mono-key">Download PDF</span> when it's ready.</p>
    </div>

    <div class="toolbar no-print">
      <div class="toolbar-group">
        <button id="download-btn" type="button" class="btn-pill btn-pill--primary">Download PDF</button>
        <button id="reset-btn" type="button" class="btn-pill btn-pill--ghost">Reset to template</button>
      </div>
      <div class="toolbar-group toolbar-meta">
        <span id="stats">0 words</span>
      </div>
    </div>

    <div class="editor-grid">
      <section class="pane editor-pane no-print">
        <div class="pane-strip">
          <label for="markdown-input" class="pane-label">Markdown</label>
          <span class="pane-hint">.md</span>
        </div>
        <textarea id="markdown-input" rows="28" spellcheck="false"></textarea>
      </section>
      <section class="pane preview-pane" aria-label="Resume preview">
        <div class="page-stage">
          <span class="page-stage-badge no-print">Live preview</span>
          <div id="preview" class="resume-preview"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site no-print">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
