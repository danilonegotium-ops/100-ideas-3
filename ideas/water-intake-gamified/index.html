<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hydration Grove — Water Intake, Gamified</title>
  <meta name="description" content="A simple app where you grow a digital tree every time you drink a glass of water." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="fireflies" aria-hidden="true">
    <span class="firefly"></span>
    <span class="firefly"></span>
    <span class="firefly"></span>
    <span class="firefly"></span>
    <span class="firefly"></span>
    <span class="firefly"></span>
  </div>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <div class="page-head">
      <p class="kicker">🌱 Hydration Grove</p>
      <h1>Water Intake, Gamified</h1>
      <p class="tagline">Every glass you drink helps your tree grow — from a bare seed to a blooming tree.</p>
    </div>

    <section class="grove-card">
      <div class="grove-ground">
        <div id="treeStage" class="tree-stage" aria-live="polite"></div>
      </div>

      <div class="droplet-row" id="dropletRow" aria-hidden="true"></div>
      <p id="progressText" class="progress-text"></p>

      <button id="drinkBtn" type="button" class="btn-drop">
        <span class="btn-drop__icon">💧</span>
        <span>I drank a glass</span>
      </button>

      <div class="grove-actions">
        <button id="undoBtn" type="button" class="btn-ghost-leaf">Undo last</button>
        <button id="resetBtn" type="button" class="btn-ghost-leaf">Reset today</button>
      </div>

      <div id="streakText" class="streak-badge"></div>
    </section>

    <details class="goal-panel">
      <summary>Change daily goal</summary>
      <div class="goal-row">
        <div>
          <label for="goalGlasses">Goal (glasses of ~250ml)</label>
          <input id="goalGlasses" type="number" min="1" max="20" step="1" value="8" />
        </div>
        <button id="saveGoalBtn" type="button" class="btn-save-goal">Save goal</button>
      </div>
    </details>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
