<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ergonomics Reminder</title>
  <meta name="description" content="Set an interval and get real browser notifications with posture and stretch tips while this tab stays open." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
    <span class="status-chip" id="erg-status-chip">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="erg-status-chip-label">Paused</span>
    </span>
  </header>

  <main class="wrap">
    <p class="eyebrow">Posture &amp; breath</p>
    <h1>Ergonomics Reminder</h1>
    <p class="tagline">Keep this tab open and it reminds you to fix your posture and stretch, on a timer you set.</p>

    <section class="breathe-stage" id="erg-stage" aria-label="Reminder status">
      <svg class="breathe-ring" viewBox="0 0 200 200" width="240" height="240" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="90" />
        <circle class="ring-progress" id="erg-ring-progress" cx="100" cy="100" r="90" />
      </svg>
      <div class="breathe-orb" id="erg-orb" aria-hidden="true">
        <span class="breathe-orb-core"></span>
      </div>
      <div class="breathe-readout">
        <div class="countdown-time mono" id="erg-countdown">--:--</div>
        <div class="countdown-label" id="erg-countdown-label">Next reminder in</div>
      </div>
    </section>

    <div class="flash-banner" id="erg-flash" hidden>
      <span class="flash-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-1 3-4 4.5-4 8a4 4 0 0 0 8 0c0-1.2-.4-2.1-.9-3" /><path d="M12 21v-5" /></svg>
      </span>
      <p class="flash-tip" id="erg-flash-tip"></p>
      <button type="button" class="btn-ghost btn-sm" id="erg-flash-dismiss">Got it</button>
    </div>

    <div class="panel">
      <div class="panel-section">
        <h2 class="panel-heading">Interval</h2>
        <p class="panel-subtext">How often reminders fire while you're working.</p>
        <div class="segmented" role="radiogroup" aria-label="Reminder interval" id="erg-interval-group">
          <button type="button" class="segment" data-value="15" role="radio" aria-checked="false">15<span>min</span></button>
          <button type="button" class="segment" data-value="30" role="radio" aria-checked="true">30<span>min</span></button>
          <button type="button" class="segment" data-value="45" role="radio" aria-checked="false">45<span>min</span></button>
          <button type="button" class="segment" data-value="60" role="radio" aria-checked="false">60<span>min</span></button>
        </div>
        <select id="erg-interval" class="visually-hidden" aria-hidden="true" tabindex="-1">
          <option value="15">15 minutes</option>
          <option value="30" selected>30 minutes</option>
          <option value="45">45 minutes</option>
          <option value="60">60 minutes</option>
        </select>
      </div>

      <div class="divider" role="separator"></div>

      <div class="panel-section">
        <h2 class="panel-heading">Notifications</h2>
        <div class="settings-row">
          <span class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg>
          </span>
          <p class="row-text mono" id="erg-permission-status"></p>
        </div>
      </div>

      <div class="divider" role="separator"></div>

      <div class="panel-actions">
        <button type="button" class="btn-primary" id="erg-start">Start</button>
        <button type="button" class="btn-ghost" id="erg-stop" disabled>Stop</button>
      </div>
    </div>
  </main>

  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
